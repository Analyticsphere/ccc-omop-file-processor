# Deploy Cloud Run Job: Reconcile Chunks (EHR PR2 merge pipeline)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: [
    'run', 'jobs', 'deploy', 'ccc-omop-file-processor-reconcile-chunks-job',
